services:
  server:
    build:
      context: .
      dockerfile: dockerfile.server
    ipc: shareable          # deixa outros containers compartilharem o /dev/shm
    shm_size: 256m
    ports:
      - "18080:18080"
    restart: unless-stopped

  i4:
    build:
      context: .
      dockerfile: dockerfile.python
      args:
        REQS: requirements-i4.txt
    command: >
      python -m pipeline.live.ao_vivo
      --model /models/model_v4_e60s1_aug.pt
      --publish --expr-rules padrao
    ipc: "service:server"   # enxerga o /dev/shm/frames_cam do server
    depends_on: [server]
    environment:
      ODS_KAFKA_BOOTSTRAP: ${ODS_KAFKA_BOOTSTRAP:-34.66.235.91:9093}
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  s6:
    build:
      context: .
      dockerfile: dockerfile.python
      args:
        REQS: requirements-s6.txt
    command: >
      python -m s6_synthesis.bus_service
      --lexicon-dir lexicon
      --trajectory-dir /data/trajectories
      --lexicon-version lexicon-a6-1.3
    environment:
      ODS_KAFKA_BOOTSTRAP: ${ODS_KAFKA_BOOTSTRAP:-34.66.235.91:9093}
    volumes:
      - trajectories:/data/trajectories
    restart: unless-stopped

volumes:
  trajectories: